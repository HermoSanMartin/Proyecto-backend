name: CI - Calidad, Pruebas y Contenedor

on:
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: "Demostrar que un error de lint bloquea la construcci?n"
        type: boolean
        default: false
  push:
    branches: [main, FelipeLienlaf]
  pull_request:
    branches: [main]

jobs:
  calidad-y-pruebas:
    name: Linter, Formato y Pruebas (>= 85% cobertura)
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET_KEY: clave-ci-pruebas-automatizadas-seguras-32chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RECOVERY_TOKEN_EXPIRE_MINUTES: "15"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      SMTP_HOST: localhost
      SMTP_PORT: "1025"

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar fallo controlado en la copia temporal de CI
        if: github.event_name == 'workflow_dispatch' && inputs.simular_fallo
        run: echo 'print(nombre_sin_definir_para_demostracion)' > tests/fallo_controlado_ci.py

      - name: Ejecutar Linter (Ruff)
        run: ruff check app tests

      - name: Verificar Formato (Ruff Format)
        run: ruff format --check app tests

      - name: Ejecutar Pruebas Unitarias, Integracion y E2E con Cobertura
        run: pytest --junitxml=reportes/pruebas.xml --cov=app --cov-report=term-missing --cov-report=xml:reportes/cobertura.xml --cov-fail-under=85

      - name: Conservar resultados y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: reportes/

  construccion-imagen:
    name: Construir Imagen Docker
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker verificable
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "galeria-arte-api:$GITHUB_SHA" .

      - name: Arranque limpio con PostgreSQL y persistencia al reiniciar la API
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export PGADMIN_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET_KEY="$(openssl rand -hex 32)"
          export PGADMIN_EMAIL=operador@example.com
          printf 'services:\n  api:\n    image: galeria-arte-api:%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/imagen.yml"
          compose=(docker compose -p verificacion -f docker-compose.yml -f "$RUNNER_TEMP/imagen.yml")
          "${compose[@]}" up -d --no-build
          salud() {
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
              http://localhost:8000/api/v1/salud | jq -e '.estado == "ok"'
          }
          salud
          test "$("${compose[@]}" ps --services --status running | wc -l)" -eq 4
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5050/misc/ping >/dev/null
          curl -fsS http://localhost:8025/api/v1/messages >/dev/null
          "${compose[@]}" exec -T api alembic current
          datos=$(jq -nc --arg pw "Prueba9$(openssl rand -hex 16)" '{nombre:"Prueba CI",email:"persistencia@example.com",password:$pw}')
          usuario=$(curl -fsS -H 'Content-Type: application/json' -d "$datos" http://localhost:8000/api/v1/auth/registro | jq -er '.id')
          "${compose[@]}" restart api
          salud
          curl -fsS -H 'Content-Type: application/json' -d "$(jq -c '{email,password}' <<< "$datos")" \
            http://localhost:8000/api/v1/auth/login | jq -e --argjson id "$usuario" '.usuario.id == $id'

      - name: Exportar imagen validada de main
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p imagen
          docker save "galeria-arte-api:$GITHUB_SHA" | gzip > imagen/galeria-api.tar.gz
          cd imagen
          sha256sum galeria-api.tar.gz > SHA256SUMS
          echo "$GITHUB_SHA" > revision.txt

      - name: Conservar imagen para promocion manual
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: galeria-api-${{ github.sha }}
          path: imagen/
          if-no-files-found: error